version: "3"
services:
  app:
    build: .
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 3s
      timeout: 3s
      retries: 5
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:14.18
    environment:
      - POSTGRES_PASSWORD=mockpassword123
      - POSTGRES_USER=tylerarciniaga
      - POSTGRES_DB=DockerPractice
    volumes:
      - dockerpractice:/var/lib/postgresql/data
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
  nginx:
    image: nginx
    ports:
      - 8080:8080
    depends_on:
      - app
      - db
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf:ro

volumes:
  dockerpractice:
