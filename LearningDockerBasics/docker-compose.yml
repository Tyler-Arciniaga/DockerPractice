version: "3"
services:
  app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 3s
      timeout: 3s
      retries: 5
    depends_on:
      - db
  db:
    image: postgres:14.18
    environment:
      - POSTGRES_PASSWORD=greenbay7
      - POSTGRES_USER=tylerarciniaga
      - POSTGRES_DB=DockerPractice
    volumes:
      - dockerpractice:/var/lib/postgresql/data
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

volumes:
  dockerpractice:
