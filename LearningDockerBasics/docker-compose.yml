version: "3"
services:
  app:
    build: .
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`)"
      - "traefik.http.services.app.loadbalancer.server.port=8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 3s
      timeout: 3s
      retries: 5
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:14.18
    environment:
      - POSTGRES_PASSWORD=mockpassword123
      - POSTGRES_USER=tylerarciniaga
      - POSTGRES_DB=DockerPractice
    volumes:
      - dockerpractice:/var/lib/postgresql/data
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
  proxy:
    image: traefik:v3.6.2
    command:
      - --providers.docker
      - --entrypoints.web.address=:80
    ports:
      - 8080:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  # nginx:
  #   image: nginx
  #   ports:
  #     - 8080:8080
  #   depends_on:
  #     - app
  #     - db
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/nginx.conf:ro

volumes:
  dockerpractice:
